<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>SPIKE-ZERO PixiJS Prototype</title>
  <link rel="stylesheet" href="./css/pixi-style.css" />
</head>
<body>
  <div id="pixiRoot">
    <div class="pixi-hud">
      <div class="title">SPIKE-ZERO · PIXIJS MAP PROTOTYPE</div>
      <div class="desc">WASD/Arrow: move · Space: machinegun · L: nebula light</div>
      <div class="map-buttons">
        <button data-map="asteroid">Asteroid</button>
        <button data-map="gas">Gas</button>
        <button data-map="magnetic">Magnetic</button>
        <button data-map="nebula">Nebula</button>
        <button data-map="orbit">Orbit</button>
      </div>
    </div>

    <div class="pixi-debug" id="pixiDebug">
      FPS: -<br>
      Bullets: -<br>
      Asteroids: -
    </div>

    <a class="back-link" href="./game.html">Back to Canvas Demo</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.18.1/dist/pixi.min.js"></script>
  <script src="./js/pixi/pixi-asteroid-flow-combat.js"></script>
</body>
</html>
